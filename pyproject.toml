[project]
name = "enterprise-worlds"
version = "0.1.0"
description = "Enterprise-Worlds — RL environments for enterprise work: executable enterprise replicas with natively multi-turn tasks and verifiable rewards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "litellm>=1.65",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock"]
hf = ["datasets>=2.0"]
gym = ["gymnasium>=0.29"]  # Gymnasium-compatible RL/training interface (enterprise_worlds.gym)

[project.scripts]
eworlds = "enterprise_worlds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``src/eops_gym`` is a deprecated alias shim for downstream consumers mid-migration;
# drop it from here (and delete the directory) once nothing imports ``eops_gym``.
packages = ["src/enterprise_worlds", "src/eops_gym"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
